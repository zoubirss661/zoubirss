
name: Train Ryma Local ML Model

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pandas requests scikit-learn joblib

      - name: Train and validate chronologically
        run: python train_ryma_model.py

      - name: Commit promoted model and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ryma_local_model.joblib models/ryma_training_report.json
          git diff --cached --quiet || git commit -m "Train Ryma local ML model"
          git push
